# Nginx configuration for CRM application
# Location: /etc/nginx/sites-available/crm
# Enable with: sudo ln -s /etc/nginx/sites-available/crm /etc/nginx/sites-enabled/crm

upstream crm_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name 165.232.54.109;

    # Increase upload size limit if needed
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;

    # React SPA - Serve from /crm path
    location /crm {
        # Remove /crm prefix before serving from dist
        alias /var/www/crm-app/dist;
        
        # Cache control for static assets
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Fallback to index.html for React Router
        error_page 404 =200 /crm/index.html;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # API routes - Proxy to backend
    location /api {
        proxy_pass http://crm_backend;
        proxy_http_version 1.1;
        
        # Headers for proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Root path redirects to /crm
    location / {
        return 301 /crm;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Access and error logs
    access_log /var/log/nginx/crm-access.log;
    error_log /var/log/nginx/crm-error.log warn;
}

# Redirect www to non-www (optional)
server {
    listen 80;
    listen [::]:80;
    server_name www.165.232.54.109;
    return 301 http://165.232.54.109$request_uri;
}
